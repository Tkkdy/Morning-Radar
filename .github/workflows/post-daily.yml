name: Post-Daily Intelligence
# Retained as an explicit read-only diagnostic entry; Daily owns all generation/delivery.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - run: python -m morning_radar release status
