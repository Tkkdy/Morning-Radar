name: Post-Daily Intelligence

on:
  workflow_dispatch:
  workflow_run:
    workflows: ["Daily Morning Radar"]
    types: [completed]
    branches: [master]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-radar-generated-data
  cancel-in-progress: false

jobs:
  enhance-and-deploy:
    if: >-
      ${{ github.event_name == 'workflow_dispatch' ||
          github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout master after Daily
        uses: actions/checkout@v4
        with:
          ref: master

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Evaluate Tendency
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python -m morning_radar run-tendency

      - name: Run triggered Deep Continuity
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python -m morning_radar run-deep-continuity

      - name: Run configured model A/B
        continue-on-error: true
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          MODEL_AB_DEEPSEEK_MODEL: ${{ vars.MODEL_AB_DEEPSEEK_MODEL }}
          QWEN_API_KEY: ${{ secrets.QWEN_API_KEY }}
          QWEN_MODEL: ${{ secrets.QWEN_MODEL }}
          QWEN_BASE_URL: ${{ secrets.QWEN_BASE_URL }}
        run: python -m morning_radar run-model-ab

      - name: Rebuild site after optional intelligence
        run: python -m morning_radar build-site

      - name: Commit generated intelligence once
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/tendencies data/continuity data/evaluations/model_ab site
          if git diff --cached --quiet; then
            echo "No post-daily generated changes to commit."
          else
            git commit -m "chore: update post-daily intelligence for $(date -u +%F)"
            git push
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy enhanced GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
