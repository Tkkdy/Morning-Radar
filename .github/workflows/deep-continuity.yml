name: Triggered Deep Continuity

on:
  workflow_dispatch:
  schedule:
    - cron: "5 1 * * *"

permissions:
  contents: write

concurrency:
  group: morning-radar-generated-data
  cancel-in-progress: false

jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Scan triggers and review only when needed
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python -m morning_radar run-deep-continuity
      - name: Commit append-only revisions
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/continuity site
          if ! git diff --cached --quiet; then
            git commit -m "chore: record triggered continuity review"
            git push
          fi
