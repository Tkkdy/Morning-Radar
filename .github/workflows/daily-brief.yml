name: Daily Morning Radar
run-name: Daily Morning Radar (${{ (inputs.dry_run && 'dry-run') || (inputs.fixtures && 'fixtures') || 'production' }})
on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: Offline synthetic preview
        type: boolean
        default: false
      dry_run:
        description: Offline synthetic preview without production state
        type: boolean
        default: false
      action:
        description: Release or recover only the selected stage
        type: choice
        options: [generate, deploy, reconcile, notify, resend, rollback]
        default: generate
      release_id:
        description: Required for recovery; frozen release identity
        type: string
      authorization_id:
        description: Required for explicit resend; acknowledge possible duplicate delivery
        type: string
      deployment_id:
        description: Actual Pages ID for reconciliation after an unknown response
        type: string
  schedule:
    - cron: "37 3 * * *"
      timezone: "Asia/Singapore"
permissions:
  contents: read
concurrency:
  group: morning-radar-generated-data
  cancel-in-progress: false
  queue: max
jobs:
  preview:
    if: ${{ inputs.fixtures || inputs.dry_run }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e ".[dev]"
      - run: python -m morning_radar release demo --output .tmp/b2-preview
      - uses: actions/upload-artifact@v4
        with:
          name: synthetic-release-preview
          path: .tmp/b2-preview
          retention-days: 3
  release:
    if: ${{ !(inputs.fixtures || inputs.dry_run) && github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      issues: read
      pages: write
      id-token: write
    environment: github-pages
    env:
      GITHUB_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ inputs.release_id }}
      AUTHORIZATION_ID: ${{ inputs.authorization_id }}
      RECOVERY_DEPLOYMENT_ID: ${{ inputs.deployment_id }}
      PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
    steps:
      # Checkout happens AFTER obtaining the shared workflow queue.
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - name: Verify code
        run: |
          python -m pytest
          python -m ruff check src tests
      - name: Ingest archive and generate coordinated release
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' }}
        id: generate
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
        run: python -m morning_radar release generate --production
      - name: Select frozen release
        env:
          GENERATED_ID: ${{ steps.generate.outputs.release_id }}
        run: |
          if [ -n "$GENERATED_ID" ]; then RELEASE_ID="$GENERATED_ID"; fi
          test -n "$RELEASE_ID"
          echo "RELEASE_ID=$RELEASE_ID" >> "$GITHUB_ENV"
      - name: Export verified frozen package
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' || inputs.action == 'deploy' || inputs.action == 'rollback' }}
        run: python -m morning_radar release export --release-id "$RELEASE_ID" --output "$RUNNER_TEMP/release-site"
      - name: Configure Pages
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' || inputs.action == 'deploy' || inputs.action == 'rollback' }}
        uses: actions/configure-pages@v5
      - name: Persist upload intent
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' || inputs.action == 'deploy' || inputs.action == 'rollback' }}
        run: python -m morning_radar release upload-intent --production --release-id "$RELEASE_ID"
      - name: Upload immutable package
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' || inputs.action == 'deploy' || inputs.action == 'rollback' }}
        id: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ runner.temp }}/release-site
      - name: Deploy and verify exact public bytes
        if: ${{ github.event_name == 'schedule' || inputs.action == 'generate' || inputs.action == 'deploy' || inputs.action == 'rollback' }}
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact_id }}
          REQUESTED_ACTION: ${{ inputs.action }}
        run: |
          action=deploy
          if [ "$REQUESTED_ACTION" = rollback ]; then action=rollback; fi
          python -m morning_radar release "$action" --production --release-id "$RELEASE_ID" --artifact-id "$ARTIFACT_ID"
      - name: Reconcile interrupted deployment
        if: ${{ inputs.action == 'reconcile' }}
        run: |
          flags=()
          if [ -n "$RECOVERY_DEPLOYMENT_ID" ]; then flags+=(--deployment-id "$RECOVERY_DEPLOYMENT_ID"); fi
          python -m morning_radar release reconcile --production --release-id "$RELEASE_ID" "${flags[@]}"
      - name: Notify confirmed release once per business day
        if: ${{ inputs.action != 'rollback' && inputs.action != 'resend' }}
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python -m morning_radar release notify --production --release-id "$RELEASE_ID"
      - name: Explicitly authorized resend
        if: ${{ inputs.action == 'resend' }}
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
        run: python -m morning_radar release resend --production --release-id "$RELEASE_ID" --authorization-id "$AUTHORIZATION_ID"
      - name: Preserve module health and physical call observations
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: radar-observations-${{ github.run_id }}-${{ github.run_attempt }}
          retention-days: 7
          if-no-files-found: ignore
          path: |
            data/health/
            data/evidence/
            data/usage/
