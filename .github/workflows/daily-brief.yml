name: Daily Morning Radar
run-name: Daily Morning Radar (${{ (inputs.dry_run && 'dry-run') || (inputs.fixtures && 'fixtures') || 'production' }})

on:
  workflow_dispatch:
    inputs:
      fixtures:
        description: "Use offline fixture data and FakeAIProvider"
        type: boolean
        default: false
      dry_run:
        description: "Run without production state changes or notification"
        type: boolean
        default: false
      force_notify:
        description: "Allow a repeated notification for the same date"
        type: boolean
        default: false
  schedule:
    # Target: Morning Radar ready before 06:00 Singapore time.
    # Scheduled early to absorb observed GitHub Actions scheduler delay.
    - cron: "37 3 * * *"
      timezone: "Asia/Singapore"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: morning-radar-generated-data
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: python -m pip install -e ".[dev]"

      - name: Verify
        run: |
          python -m pytest
          python -m ruff check src tests

      - name: Collect durable intake checkpoint
        id: collect
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          flags=()
          if [[ "${{ inputs.fixtures || false }}" == "true" ]]; then flags+=(--fixtures); fi
          if [[ "${{ inputs.dry_run || false }}" == "true" ]]; then flags+=(--dry-run); fi
          python -m morning_radar collect "${flags[@]}" > "${RUNNER_TEMP}/collect.json"
          batch_id="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["batch_id"])' "${RUNNER_TEMP}/collect.json")"
          business_date="$(python -c 'import json,sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["business_date"])' "${RUNNER_TEMP}/collect.json")"
          echo "batch_id=${batch_id}" >> "$GITHUB_OUTPUT"
          echo "business_date=${business_date}" >> "$GITHUB_OUTPUT"

      - name: Commit intake checkpoint
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/intake data/state data/raw data/snapshots
          if git diff --cached --quiet; then
            echo "No intake checkpoint changes to commit."
          else
            git commit -m "chore: save morning radar intake checkpoint for ${{ steps.collect.outputs.business_date }}"
            git push
          fi

      - name: Process saved intake
        id: process
        shell: bash
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          GITHUB_TOKEN: ${{ github.token }}
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          flags=()
          if [[ "${{ inputs.fixtures || false }}" == "true" ]]; then flags+=(--fixtures); fi
          if [[ "${{ inputs.dry_run || false }}" == "true" ]]; then flags+=(--dry-run); fi
          flags+=(--skip-notify)
          flags+=(--batch-id "${{ steps.collect.outputs.batch_id }}")
          python -m morning_radar process "${flags[@]}" > "${RUNNER_TEMP}/process.json"
          brief_date="$(python -c "import json,os,pathlib; print(json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'process.json').read_text(encoding='utf-8'))['brief_date'])")"
          brief_hash="$(python -c "import json,os,pathlib; print(json.loads((pathlib.Path(os.environ['RUNNER_TEMP'])/'process.json').read_text(encoding='utf-8'))['brief_hash'])")"
          echo "brief_date=${brief_date}" >> "$GITHUB_OUTPUT"
          echo "brief_hash=${brief_hash}" >> "$GITHUB_OUTPUT"

      - name: Commit generated history
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data site
          if git diff --cached --quiet; then
            echo "No generated changes to commit."
          else
            git commit -m "chore: update morning radar for ${{ steps.process.outputs.brief_date }}"
            git push
          fi

      - name: Configure GitHub Pages
        if: ${{ always() && !cancelled() && !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        uses: actions/configure-pages@v5

      - name: Publish failed Radar status
        if: ${{ failure() && !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        id: radar_failure_status
        shell: bash
        run: |
          mkdir -p site
          python - <<'PY'
          import json
          from datetime import UTC, datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          now = datetime.now(UTC)
          status = {
              "run_date": str(now.astimezone(ZoneInfo("Asia/Singapore")).date()),
              "status": "FAILED",
              "updated_at": now.isoformat(),
              "detail": "Daily Morning Radar workflow failed",
          }
          Path("site/status.json").write_text(
              json.dumps(status, ensure_ascii=False, separators=(",", ":")),
              encoding="utf-8",
          )
          PY

      - name: Upload Pages artifact
        if: ${{ always() && !cancelled() && (success() || steps.radar_failure_status.outcome == 'success') && !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        id: pages_artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy GitHub Pages
        if: ${{ always() && !cancelled() && steps.pages_artifact.outcome == 'success' && !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Record successful Pages deployment
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        run: python -m morning_radar record-deploy --date "${{ steps.process.outputs.brief_date }}" --brief-hash "${{ steps.process.outputs.brief_hash }}"

      - name: Commit deployment confirmation
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        shell: bash
        run: |
          git add data/state/publish.json data/intake
          if git diff --cached --quiet; then
            echo "No deployment confirmation to commit."
          else
            git commit -m "chore: record morning radar deployment state"
            git push
          fi

      - name: Notify after successful Pages deployment
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        shell: bash
        env:
          WXPUSHER_APP_TOKEN: ${{ secrets.WXPUSHER_APP_TOKEN }}
          WXPUSHER_UIDS: ${{ secrets.WXPUSHER_UIDS }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          flags=()
          if [[ "${{ inputs.force_notify || false }}" == "true" ]]; then flags+=(--force); fi
          python -m morning_radar notify-latest "${flags[@]}"

      - name: Commit notification state
        if: ${{ !(inputs.dry_run || false) && !(inputs.fixtures || false) }}
        shell: bash
        run: |
          git add data/state/notifications.json
          if git diff --cached --quiet; then
            echo "No notification state change to commit."
          else
            git commit -m "chore: record morning radar notification state"
            git push
          fi
