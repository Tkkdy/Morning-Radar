name: Manual Morning Radar Preview

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .

      - name: Check AI provider configuration
        shell: bash
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_MODEL: ${{ vars.SENSENOVA_MODEL }}
          SENSENOVA_BASE_URL: ${{ vars.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
        run: |
          missing=()
          case "$AI_PROVIDER" in
            deepseek)
              [[ -n "$DEEPSEEK_API_KEY" ]] || missing+=("DEEPSEEK_API_KEY")
              [[ -n "$DEEPSEEK_MODEL" ]] || missing+=("DEEPSEEK_MODEL")
              [[ -n "$DEEPSEEK_BASE_URL" ]] || missing+=("DEEPSEEK_BASE_URL")
              ;;
            sensenova)
              [[ -n "$SENSENOVA_API_KEY" ]] || missing+=("SENSENOVA_API_KEY")
              [[ -n "$SENSENOVA_MODEL" ]] || missing+=("SENSENOVA_MODEL")
              ;;
            *)
              missing+=("AI_PROVIDER must be deepseek or sensenova")
              ;;
          esac
          if (( ${#missing[@]} > 0 )); then
            echo "::error::Missing required GitHub Actions configuration: ${missing[*]}"
            exit 1
          fi

      - name: Generate preview
        env:
          AI_PROVIDER: ${{ vars.AI_PROVIDER || 'deepseek' }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DEEPSEEK_MODEL: ${{ secrets.DEEPSEEK_MODEL }}
          DEEPSEEK_BASE_URL: ${{ secrets.DEEPSEEK_BASE_URL }}
          SENSENOVA_API_KEY: ${{ secrets.SENSENOVA_API_KEY }}
          SENSENOVA_MODEL: ${{ vars.SENSENOVA_MODEL }}
          SENSENOVA_BASE_URL: ${{ vars.SENSENOVA_BASE_URL || 'https://token.sensenova.cn/v1' }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m morning_radar run --dry-run --skip-notify

      - name: Upload preview artifact
        uses: actions/upload-artifact@v4
        with:
          name: morning-radar-preview
          path: |
            .tmp/dry-run/data/briefs/
            .tmp/dry-run/data/continuity/
            .tmp/dry-run/data/radar_signals/
            .tmp/dry-run/data/tendencies/
            .tmp/dry-run/data/stories/
            .tmp/dry-run/site/
          if-no-files-found: error
          retention-days: 3
