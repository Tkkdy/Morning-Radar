name: Tendency Inbox Archive
on:
  issues:
    types: [opened, edited, reopened, closed]
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: morning-radar-generated-data
  cancel-in-progress: false
  queue: max
jobs:
  ingest:
    if: ${{ github.ref == 'refs/heads/master' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e .
      - name: Bounded rescan of authenticated GitHub originals
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python -m morning_radar release ingest --production
