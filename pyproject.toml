[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "morning-radar"
version = "0.1.0"
description = "A traceable personal AI, market, and developer ecosystem morning brief."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "feedparser>=6.0,<7",
  "httpx>=0.27,<1",
  "jinja2>=3.1,<4",
  "openai>=2.0,<3",
  "pydantic>=2.9,<3",
  "python-dateutil>=2.9,<3",
  "pyyaml>=6.0,<7",
  "tenacity>=9.0,<10",
  "yfinance>=0.2,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<10",
  "pytest-cov>=6.0,<8",
  "ruff>=0.9,<1",
]

[project.scripts]
morning-radar = "morning_radar.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/morning_radar"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
